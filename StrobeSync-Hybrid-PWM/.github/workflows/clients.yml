name: Host client checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python client
        run: python -m pip install -e ./clients/python
      - name: Compile Python client
        run: python -m compileall -q clients/python/strobesync
      - name: Run protocol unit tests
        run: python -m unittest discover -s clients/python/tests -v

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build client
        run: dotnet build clients/csharp/StrobeSyncController/StrobeSyncController.csproj -c Release
      - name: Build console example
        run: dotnet build examples/csharp/StrobeSyncConsole/StrobeSyncConsole.csproj -c Release
